<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ReadMind - Preguntas Frecuentes</title>


    <!-- =========================================================
         FONT AWESOME
         ========================================================= -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>


        /* =========================================================
           PANEL DE CONTROL
           ========================================================= */

        :root {

            /* Fondo general */

            --fondo-libros-opacidad: 0.25;
            --fondo-libros-tamano: 450px;
            --fondo-libros-posicion-y: 12%;
            --fondo-libros-posicion-x: 50%;


            /* Logo */

            --logo-ancho: 160px;
            --logo-margen-abajo: 12px;


            /* Título FAQ */

            --titulo-tamano: 24px;
            --titulo-margen-abajo: 10px;


            /* Texto FAQ */

            --faq-ancho: 100%;
            --faq-tamano: 16px;
            --faq-interlineado: 1.25;
            --faq-espacio-seccion: 15px;


            /* Respuestas */

            --respuesta-tamano: 15px;
            --respuesta-margen-izquierdo: 24px;


            /* ChatBot */

            --chatbot-ancho-maximo: 500px;


            /* Posición sobre la pizarra */

            --pizarra-input-top: 22%;
            --pizarra-input-left: 7%;
            --pizarra-input-width: 86%;
            --pizarra-input-height: 56%;


            /* Botón enviar */

            --chatbot-boton-ancho: 105px;
            --chatbot-boton-alto: 38px;


            /* Botón volver */

            --distancia-volver-arriba: 22px;
            --distancia-volver-abajo: 10px;


            /* Footer */

            --distancia-footer-arriba: 20px;
            --footer-padding-lateral: 15px;
            --espacio-entre-idiomas: 8px;


            /* Posición botones idioma */

            --desplazar-es: 0px;
            --desplazar-en: 0px;


            /* Botones idioma */

            --tamano-boton-idioma: 34px;
            --grosor-linea-idioma: 1.5px;
            --tamano-texto-idioma: 14px;

        }


        /* =========================================================
           TÍTULO
           ========================================================= */

        .titulo-tituloweb {

            font-size: 24px;

            position: relative;

            top: -10px;

            margin-bottom: 10px;

        }


        /* =========================================================
           ANIMACIÓN LATIDO
           ========================================================= */

        .latido {

            animation:
                latidoSuave
                2s
                ease-in-out
                infinite;

        }


        @keyframes latidoSuave {

            0%,
            100% {

                transform: scale(1);

            }

            50% {

                transform: scale(1.04);

            }

        }


        /* =========================================================
           ESTILOS GENERALES
           ========================================================= */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

        }


        body {

            background:
                linear-gradient(
                    -45deg,
                    #3bb2ea,
                    #76639c,
                    #95455c,
                    #3bb2ea
                );

            background-size: 400% 400%;

            animation:
                gradientBG
                15s
                ease
                infinite;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            color: white;

            padding: 20px 10px;

            position: relative;

            overflow-x: hidden;

        }


        @keyframes gradientBG {

            0% {

                background-position: 0% 50%;

            }

            50% {

                background-position: 100% 50%;

            }

            100% {

                background-position: 0% 50%;

            }

        }


        /* =========================================================
           PARTÍCULAS
           ========================================================= */

        .area-particulas {

            position: fixed;

            inset: 0;

            z-index: 0;

            overflow: hidden;

            pointer-events: none;

        }


        .circulos {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

        }


        .circulos li {

            position: absolute;

            display: block;

            list-style: none;

            background:
                rgba(255,255,255,0.12);

            animation:
                subirParticulas
                linear
                infinite;

            border-radius: 50%;

            bottom: -100px;

        }


        .circulos li:nth-child(1) {
            left: 10%;
            width: 50px;
            height: 50px;
            animation-duration: 20s;
            animation-delay: -5s;
        }

        .circulos li:nth-child(2) {
            left: 25%;
            width: 20px;
            height: 20px;
            animation-duration: 12s;
            animation-delay: -8s;
        }

        .circulos li:nth-child(3) {
            left: 45%;
            width: 60px;
            height: 60px;
            animation-duration: 25s;
            animation-delay: -12s;
        }

        .circulos li:nth-child(4) {
            left: 65%;
            width: 25px;
            height: 25px;
            animation-duration: 15s;
            animation-delay: -3s;
        }

        .circulos li:nth-child(5) {
            left: 85%;
            width: 40px;
            height: 40px;
            animation-duration: 18s;
            animation-delay: -15s;
        }

        .circulos li:nth-child(6) {
            left: 15%;
            width: 30px;
            height: 30px;
            animation-duration: 14s;
            animation-delay: -7s;
        }

        .circulos li:nth-child(7) {
            left: 35%;
            width: 15px;
            height: 15px;
            animation-duration: 10s;
            animation-delay: -2s;
        }

        .circulos li:nth-child(8) {
            left: 55%;
            width: 45px;
            height: 45px;
            animation-duration: 22s;
            animation-delay: -18s;
        }

        .circulos li:nth-child(9) {
            left: 75%;
            width: 20px;
            height: 20px;
            animation-duration: 16s;
            animation-delay: -9s;
        }

        .circulos li:nth-child(10) {
            left: 90%;
            width: 35px;
            height: 35px;
            animation-duration: 19s;
            animation-delay: -11s;
        }


        @keyframes subirParticulas {

            0% {

                transform:
                    translateY(0)
                    scale(1);

                opacity: 1;

            }

            100% {

                transform:
                    translateY(-120vh)
                    scale(0.5);

                opacity: 0;

            }

        }


        /* =========================================================
           CONTENEDOR PRINCIPAL
           ========================================================= */

        .contenido-principal {

            z-index: 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            width: 100%;

            max-width: 500px;

            position: relative;

        }


        /* =========================================================
           LOGO
           ========================================================= */

        @keyframes float {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }

            100% {
                transform: translateY(0);
            }

        }


        .logo {

            width:
                var(--logo-ancho);

            margin-bottom:
                var(--logo-margen-abajo);

            animation:
                float
                3.5s
                ease-in-out
                infinite;

            filter:
                drop-shadow(
                    0 10px 10px
                    rgba(0,0,0,0.3)
                )
                drop-shadow(
                    0 0 5px
                    rgba(255,255,255,0.4)
                );

        }


        /* =========================================================
           TÍTULO FAQ
           ========================================================= */

        .titulo-faq {

            font-size:
                var(--titulo-tamano);

            font-style: italic;

            font-weight: 700;

            text-align: center;

            margin-bottom:
                var(--titulo-margen-abajo);

            text-shadow:
                1px 2px 3px
                rgba(0,0,0,0.35);

        }


        /* =========================================================
           FAQ
           ========================================================= */

        .faq {

            width:
                var(--faq-ancho);

        }


        .faq-seccion {

            margin-bottom:
                var(--faq-espacio-seccion);

        }


        .faq-seccion-titulo {

            font-size: 16px;

            font-style: italic;

            font-weight: bold;

            margin-bottom: 2px;

        }


        .accordion {

            width: 100%;

        }


        .accordion-item {

            width: 100%;

        }


        .accordion-header {

            width: 100%;

            border: none;

            background: transparent;

            color: white;

            text-align: left;

            cursor: pointer;

            font-size:
                var(--faq-tamano);

            line-height:
                var(--faq-interlineado);

            padding: 1px 0;

            text-shadow:
                1px 1px 2px
                rgba(0,0,0,0.25);

        }


        .accordion-header:hover {

            color: #ffe6f7;

        }


        .accordion-item.open
        .accordion-header {

            color: #FFD700;

        }


        .accordion-item.open
        .accordion-content p {

            color: #FFD700;

        }


        .accordion-header .signo {

            display: inline-block;

            width: 18px;

            font-weight: bold;

            transition:
                transform 0.25s ease;

        }


        .accordion-content {

            max-height: 0;

            overflow: hidden;

            transition:
                max-height 0.4s ease;

            padding-left:
                var(--respuesta-margen-izquierdo);

        }


        .accordion-content p {

            font-size:
                var(--respuesta-tamano);

            line-height: 1.35;

            padding:
                5px 10px 7px 0;

            color: #fff;

        }


        /* =========================================================
           CHATBOT
           ========================================================= */

        .chatbot-zona {

            position: relative;

            width: 100%;

            max-width:
                var(--chatbot-ancho-maximo);

            margin-top: 4px;

        }


        .fondo-ilustracion {

            display: block;

            width: 100%;

            height: auto;

            pointer-events: none;

            user-select: none;

        }


        .chatbot-panel {

            position: absolute;

            top:
                var(--pizarra-input-top);

            left:
                var(--pizarra-input-left);

            width:
                var(--pizarra-input-width);

            height:
                var(--pizarra-input-height);

            z-index: 3;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: space-between;

            padding: 10px;

        }


        .chatbot-respuesta {

            width: 100%;

            flex: 1;

            border: none;

            outline: none;

            resize: none;

            background: transparent;

            color: #333;

            font-size: 15px;

            line-height: 1.35;

            padding:
                5px 8px 45px 8px;

            overflow-y: auto;

        }


        .chatbot-respuesta::placeholder {

            color:
                rgba(80,80,80,0.75);

        }


        .chatbot-form {

            position: absolute;

            left: 10px;

            right: 10px;

            bottom: 8px;

            display: flex;

            gap: 7px;

            justify-content: center;

        }


        .chatbot-input {

            flex: 1;

            min-width: 0;

            height: 38px;

            border:
                1px solid
                rgba(70,70,70,0.35);

            border-radius: 18px;

            padding:
                0 13px;

            font-size: 14px;

            outline: none;

            background:
                rgba(255,255,255,0.94);

            color: #333;

            box-shadow:
                0 2px 5px
                rgba(0,0,0,0.15);

        }


        .chatbot-enviar {

            width:
                var(--chatbot-boton-ancho);

            height:
                var(--chatbot-boton-alto);

            border: none;

            border-radius: 20px;

            background: #76639c;

            color: white;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 3px 7px
                rgba(0,0,0,0.25);

            transition:
                transform .2s ease,
                background .2s ease;

        }


        .chatbot-enviar:hover {

            transform:
                translateY(-2px);

            background: #d82b98;

        }


        /* =========================================================
           BOTÓN VOLVER
           ========================================================= */

        .btn-volver {

            margin-top:
                var(--distancia-volver-arriba);

            margin-bottom:
                var(--distancia-volver-abajo);

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            background-color:
                rgba(255,255,255,0.15);

            color: white;

            border:
                2px solid
                rgba(255,255,255,0.6);

            text-decoration: none;

            padding:
                10px 25px;

            border-radius: 30px;

            font-size: 16px;

            font-weight: bold;

            transition:
                all .3s ease;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.2);

            backdrop-filter:
                blur(5px);

        }


        .btn-volver:hover {

            background-color: white;

            color: #d82b98;

            border-color: white;

            transform:
                translateY(-2px);

        }


        .btn-volver i {

            font-size: 14px;

            transition:
                transform .3s ease;

        }


        .btn-volver:hover i {

            transform:
                translateX(-4px);

        }


        /* =========================================================
           FOOTER
           ========================================================= */

        .footer {

            margin-top:
                var(--distancia-footer-arriba);

            padding-bottom: 20px;

            display: flex;

            flex-direction: column;

            align-items: center;

            width: 100%;

        }


        .fila-inferior {

            width: 100%;

            display: grid;

            grid-template-columns:
                1fr auto 1fr;

            align-items: center;

            padding:
                0 var(--footer-padding-lateral);

            margin-bottom: 10px;

        }


        .banderas-idioma {

            justify-self: start;

            display: flex;

            gap:
                var(--espacio-entre-idiomas);

            align-items: center;

        }


        .btn-bandera {

            display: inline-flex;

            justify-content: center;

            align-items: center;

            width:
                var(--tamano-boton-idioma);

            height:
                var(--tamano-boton-idioma);

            background: transparent;

            border:
                var(--grosor-linea-idioma)
                solid
                rgba(255,255,255,0.9);

            border-radius: 50%;

            cursor: pointer;

            transition:
                transform .3s ease,
                background-color .3s ease;

            box-shadow:
                0 2px 6px
                rgba(0,0,0,0.4);

            color:
                rgba(255,255,255,0.9);

            font-size:
                var(--tamano-texto-idioma);

            font-weight: bold;

            text-shadow:
                1px 1px 2px
                rgba(0,0,0,0.5);

        }


        .btn-es {

            position: relative;

            left:
                var(--desplazar-es);

        }


        .btn-en {

            position: relative;

            left:
                var(--desplazar-en);

        }


        .btn-bandera:hover {

            transform:
                scale(1.15);

            background-color:
                rgba(255,255,255,0.2);

        }


        .handle {

            justify-self: center;

            font-size: 17px;

            font-weight: bold;

            text-shadow:
                1px 1px 2px
                rgba(0,0,0,0.4);

        }


        .social-icons {

            display: flex;

            gap: 18px;

            margin-top: -5px;

        }


        .social-icons a {

            color: white;

            font-size: 30px;

            text-decoration: none;

            transition:
                transform .3s ease,
                color .3s ease;

        }


        .social-icons a:hover {

            transform:
                scale(1.15);

        }


        .social-icons .fa-instagram:hover {

            color: #E1306C;

        }


        .social-icons .fa-tiktok:hover {

            color: #000;

            text-shadow:
                2px 2px 0 #00f2fe,
                -2px -2px 0 #fe0979;

        }


        .social-icons .fa-youtube:hover {

            color: #FF0000;

        }


        .social-icons .fa-pinterest:hover {

            color: #E60023;

        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 480px) {

            :root {

                --logo-ancho: 150px;

                --titulo-tamano: 23px;

                --faq-tamano: 15px;

                --respuesta-tamano: 14px;

            }


            body {

                padding:
                    15px 10px;

            }


            .chatbot-panel {

                padding: 7px;

            }


            .chatbot-respuesta {

                font-size: 14px;

            }


            .chatbot-input {

                font-size: 12px;

            }


            .chatbot-enviar {

                width: 78px;

                font-size: 12px;

            }

        }


    </style>

</head>


<body>


    <!-- =========================================================
         PARTÍCULAS
         ========================================================= -->

    <div class="area-particulas">

        <ul class="circulos">

            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>

        </ul>

    </div>


    <!-- =========================================================
         CONTENIDO PRINCIPAL

    <main class="contenido-principal">

        <!-- =====================================================

        <h1

        <!-- =====================================================

             ===================================================== -->

    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        /* =========================================================
           VARIABLES GLOBALES
           ========================================================= */

        let idiomaActual = "es";

        let datosBot = null;

        let preguntasExtra = null;


        /* =========================================================
           PALABRAS IGNORADAS
           
           Se utilizan para mejorar la búsqueda.
           ========================================================= */

        const palabrasIgnoradas = new Set([


            /* ESPAÑOL */

            "el",
            "la",
            "los",
            "las",

            "un",
            "una",
            "unos",
            "unas",

            "de",
            "del",
            "al",

            "que",
            "qué",

            "para",
            "por",

            "en",
            "con",

            "y",
            "o",

            "es",
            "son",

            "se",
            "me",
            "mi",

            "puedo",
            "puede",

            "cómo",
            "como",

            "donde",
            "dónde",

            "está",
            "esta",
            "estan",
            "están",

            "los",
            "las",

            "hay",
            "ser",
            "sos",
            "soy",


            /* INGLÉS */

            "the",
            "a",
            "an",

            "of",
            "to",
            "for",
            "from",

            "in",
            "on",
            "at",
            "with",

            "and",
            "or",

            "is",
            "are",
            "am",

            "be",
            "been",

            "can",
            "could",

            "do",
            "does",
            "did",

            "how",
            "what",
            "where",
            "when",
            "why",
            "who",

            "my",
            "me",
            "you",
            "your",

            "i",
            "we",
            "they",

            "it",
            "this",
            "that",

            "these",
            "those"

        ]);


        /* =========================================================
           NORMALIZAR TEXTO
           ========================================================= */

        function normalizarTexto(texto) {

            return String(texto || "")

                .toLowerCase()

                .normalize("NFD")

                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                )

                .replace(
                    /[¿?¡!.,;:()[\]{}"'`´]/g,
                    " "
                )

                .replace(
                    /\s+/g,
                    " "
                )

                .trim();

        }


        /* =========================================================
           OBTENER PALABRAS
           ========================================================= */

        function obtenerPalabras(texto) {

            return normalizarTexto(texto)

                .split(" ")

                .filter(
                    palabra =>

                        palabra.length > 2 &&

                        !palabrasIgnoradas.has(
                            palabra
                        )
                );

        }


        /* =========================================================
           CARGAR BOT.JSON
           ========================================================= */

        async function cargarBotJSON() {

            const respuesta =
                await fetch(
                    "json/bot.json",
                    {
                        cache: "no-store"
                    }
                );


            if (!respuesta.ok) {

                throw new Error(
                    "No se pudo cargar json/bot.json"
                );

            }


            datosBot =
                await respuesta.json();


            if (!datosBot) {

                throw new Error(
                    "bot.json está vacío."
                );

            }

        }


        /* =========================================================
           CARGAR PREGUNTAS.JSON
           
           Se admite:

           1. Formato bilingüe:

              {
                  "es": [],
                  "en": []
              }

           2. Formato anterior:

              [
                  {...},
                  {...}
              ]

           Esto permite mantener compatibilidad.
           ========================================================= */

        async function cargarPreguntasJSON() {

            const respuesta =
                await fetch(
                    "json/preguntas.json",
                    {
                        cache: "no-store"
                    }
                );


            if (!respuesta.ok) {

                throw new Error(
                    "No se pudo cargar json/preguntas.json"
                );

            }


            preguntasExtra =
                await respuesta.json();


            if (
                !Array.isArray(preguntasExtra) &&
                typeof preguntasExtra !== "object"
            ) {

                throw new Error(
                    "El formato de preguntas.json no es válido."
                );

            }

        }


        /* =========================================================
           CARGAR LOS DOS JSON
           ========================================================= */

        async function cargarDatos() {

            try {


                /*
                 * Cargar bot.json
                 */

                await cargarBotJSON();


                /*
                 * Cargar preguntas.json
                 */

                await cargarPreguntasJSON();


                /*
                 * Aplicar idioma
                 */

                aplicarIdioma(
                    idiomaActual
                );


            } catch (error) {

                console.error(
                    "ERROR CARGANDO LOS JSON:",
                    error
                );


                mostrarRespuesta(

                    "No se pudieron cargar correctamente los archivos bot.json y preguntas.json."

                );

            }

        }


        /* =========================================================
           OBTENER DATOS DEL IDIOMA DESDE BOT.JSON
           ========================================================= */

        function obtenerDatosIdioma() {

            if (!datosBot) {

                return null;

            }


            /*
             * Formato esperado:
             *
             * {
             *    "es": {...},
             *    "en": {...}
             * }
             */

            if (
                datosBot[idiomaActual]
            ) {

                return datosBot[
                    idiomaActual
                ];

            }


            return null;

        }


        /* =========================================================
           OBTENER PREGUNTAS.JSON DEL IDIOMA
           ========================================================= */

        function obtenerPreguntasIdioma() {

            if (!preguntasExtra) {

                return [];

            }


            /*
             * NUEVO FORMATO BILINGÜE
             */

            if (
                !Array.isArray(
                    preguntasExtra
                )
            ) {

                if (
                    Array.isArray(
                        preguntasExtra[
                            idiomaActual
                        ]
                    )
                ) {

                    return preguntasExtra[
                        idiomaActual
                    ];

                }


                return [];

            }


            /*
             * FORMATO ANTIGUO
             *
             * Si es un array directamente,
             * se considera español.
             */

            if (
                idiomaActual === "es"
            ) {

                return preguntasExtra;

            }


            return [];

        }


        /* =========================================================
           APLICAR IDIOMA
           ========================================================= */

        function aplicarIdioma(
            idioma
        ) {

            idiomaActual =
                idioma;


            const idiomaDatos =
                obtenerDatosIdioma();


            if (!idiomaDatos) {

                console.error(
                    "No existe información para:",
                    idioma
                );

                return;

            }


            /*
             * Idioma HTML
             */

            document.documentElement.lang =
                idioma;


            /*
             * TÍTULO DEL NAVEGADOR
             */

            if (
                idiomaDatos.tituloweb
            ) {

                document.title =
                    "ReadMind - " +
                    idiomaDatos.tituloweb;

            }


            /*
             * TÍTULO VISIBLE
             */

            const titulo =
                document.getElementById(
                    "tituloWeb"
                );


            if (titulo) {

                titulo.textContent =
                    idiomaDatos.tituloweb;

            }


            /*
             * SALUDO INICIAL
             */

            const mensajeInicial =
                document.getElementById(
                    "mensajeInicial"
                );


            if (
                mensajeInicial &&
                idiomaDatos.mensajeInicial
            ) {

                mensajeInicial.textContent =
                    idiomaDatos.mensajeInicial;

            }


            /*
             * PLACEHOLDER
             */

            const input =
                document.getElementById(
                    "chatbotInput"
                );


            if (
                input &&
                idiomaDatos.placeholderInput
            ) {

                input.placeholder =
                    idiomaDatos.placeholderInput;


                input.setAttribute(
                    "aria-label",
                    idiomaDatos.placeholderInput
                );

            }


            /*
             * BOTÓN ENVIAR
             */

            const botonEnviar =
                document.querySelector(
                    ".chatbot-enviar"
                );


            if (
                botonEnviar &&
                idiomaDatos.botonEnviar
            ) {

                botonEnviar.textContent =
                    idiomaDatos.botonEnviar;

            }


            /*
             * BOTÓN VOLVER
             */

            const botonVolver =
                document.getElementById(
                    "textoVolver"
                );


            if (
                botonVolver &&
                idiomaDatos.btnVolver
            ) {

                botonVolver.textContent =
                    idiomaDatos.btnVolver;

            }


            /*
             * RECONSTRUIR FAQ
             */

            cargarPreguntasFrecuentes();


            /*
             * MOSTRAR SALUDO
             */

            if (
                idiomaDatos.mensajeInicial
            ) {

                mostrarRespuesta(
                    idiomaDatos.mensajeInicial
                );

            }

        }


        /* =========================================================
           CAMBIAR IDIOMA
           ========================================================= */

        function cambiarIdioma(
            idioma
        ) {

            if (
                idioma !== "es" &&
                idioma !== "en"
            ) {

                return;

            }


            if (!datosBot) {

                console.error(
                    "bot.json todavía no fue cargado."
                );

                return;

            }


            aplicarIdioma(
                idioma
            );


            console.log(
                "Idioma seleccionado:",
                idioma
            );

        }


        /* =========================================================
           CARGAR FAQ
           ========================================================= */

        function cargarPreguntasFrecuentes() {

            const contenedor =
                document.getElementById(
                    "faq"
                );


            contenedor.innerHTML = "";


            const idiomaDatos =
                obtenerDatosIdioma();


            if (
                !idiomaDatos ||
                !Array.isArray(
                    idiomaDatos.faqData
                )
            ) {

                console.error(
                    "No existe faqData para:",
                    idiomaActual
                );

                return;

            }


            const FAQ =
                idiomaDatos.faqData;


            const categorias = [];


            /*
             * Obtener categorías únicas
             */

            FAQ.forEach(
                item => {

                    if (
                        !categorias.includes(
                            item.categoria
                        )
                    ) {

                        categorias.push(
                            item.categoria
                        );

                    }

                }
            );


            /*
             * Crear categorías
             */

            categorias.forEach(
                categoria => {


                    const seccion =
                        document.createElement(
                            "div"
                        );


                    seccion.className =
                        "faq-seccion";


                    const titulo =
                        document.createElement(
                            "div"
                        );


                    titulo.className =
                        "faq-seccion-titulo";


                    titulo.textContent =
                        categoria;


                    const accordion =
                        document.createElement(
                            "div"
                        );


                    accordion.className =
                        "accordion";


                    /*
                     * Preguntas
                     */

                    FAQ

                        .filter(
                            item =>
                                item.categoria ===
                                categoria
                        )

                        .forEach(
                            item => {


                                const elemento =
                                    document.createElement(
                                        "div"
                                    );


                                elemento.className =
                                    "accordion-item";


                                const boton =
                                    document.createElement(
                                        "button"
                                    );


                                boton.className =
                                    "accordion-header";


                                boton.type =
                                    "button";


                                /*
                                 * IMPORTANTE:
                                 * No usamos innerHTML con el texto
                                 * proveniente del JSON.
                                 */

                                const signo =
                                    document.createElement(
                                        "span"
                                    );


                                signo.className =
                                    "signo";


                                signo.textContent =
                                    "+";


                                const textoPregunta =
                                    document.createElement(
                                        "span"
                                    );


                                textoPregunta.textContent =
                                    item.pregunta;


                                boton.appendChild(
                                    signo
                                );


                                boton.appendChild(
                                    textoPregunta
                                );


                                /*
                                 * Respuesta
                                 */

                                const respuesta =
                                    document.createElement(
                                        "div"
                                    );


                                respuesta.className =
                                    "accordion-content";


                                const textoRespuesta =
                                    document.createElement(
                                        "p"
                                    );


                                textoRespuesta.textContent =
                                    item.respuesta;


                                respuesta.appendChild(
                                    textoRespuesta
                                );


                                elemento.appendChild(
                                    boton
                                );


                                elemento.appendChild(
                                    respuesta
                                );


                                accordion.appendChild(
                                    elemento
                                );


                                /*
                                 * Abrir / cerrar
                                 */

                                boton.addEventListener(
                                    "click",
                                    () => {


                                        const estabaAbierto =
                                            elemento
                                                .classList
                                                .contains(
                                                    "open"
                                                );


                                        /*
                                         * Cerrar todos
                                         */

                                        accordion

                                            .querySelectorAll(
                                                ".accordion-item"
                                            )

                                            .forEach(
                                                otro => {


                                                    otro
                                                        .classList
                                                        .remove(
                                                            "open"
                                                        );


                                                    const contenido =
                                                        otro
                                                            .querySelector(
                                                                ".accordion-content"
                                                            );


                                                    contenido.style.maxHeight =
                                                        null;


                                                    const signoOtro =
                                                        otro
                                                            .querySelector(
                                                                ".signo"
                                                            );


                                                    if (
                                                        signoOtro
                                                    ) {

                                                        signoOtro.textContent =
                                                            "+";

                                                    }

                                                }
                                            );


                                        /*
                                         * Abrir seleccionado
                                         */

                                        if (
                                            !estabaAbierto
                                        ) {

                                            elemento
                                                .classList
                                                .add(
                                                    "open"
                                                );


                                            respuesta.style.maxHeight =
                                                respuesta
                                                    .scrollHeight +
                                                "px";


                                            signo.textContent =
                                                "-";

                                        }

                                    }
                                );


                            }
                        );


                    seccion.appendChild(
                        titulo
                    );


                    seccion.appendChild(
                        accordion
                    );


                    contenedor.appendChild(
                        seccion
                    );

                }
            );

        }


        /* =========================================================
           CREAR BASE COMPLETA DEL CHATBOT
           ========================================================= */

        function obtenerBaseChatbot() {

            const base = [];


            /* =====================================================
               1. FAQ DE BOT.JSON
               ===================================================== */

            const idiomaDatos =
                obtenerDatosIdioma();


            if (
                idiomaDatos &&
                Array.isArray(
                    idiomaDatos.faqData
                )
            ) {

                idiomaDatos.faqData.forEach(
                    item => {

                        if (
                            item.pregunta &&
                            item.respuesta
                        ) {

                            base.push({

                                categoria:
                                    item.categoria || "",

                                pregunta:
                                    item.pregunta,

                                respuesta:
                                    item.respuesta

                            });

                        }

                    }
                );

            }


            /* =====================================================
               2. PREGUNTAS.JSON
               
               AHORA SÍ:
               se cargan las preguntas correspondientes
               al idioma actual.
               ===================================================== */

            const preguntasIdioma =
                obtenerPreguntasIdioma();


            if (
                Array.isArray(
                    preguntasIdioma
                )
            ) {

                preguntasIdioma.forEach(
                    item => {

                        if (
                            item.pregunta &&
                            item.respuesta
                        ) {

                            base.push({

                                categoria:
                                    item.categoria || "",

                                pregunta:
                                    item.pregunta,

                                respuesta:
                                    item.respuesta

                            });

                        }

                    }
                );

            }


            return base;

        }


        /* =========================================================
           CALCULAR SIMILITUD
           ========================================================= */

        function calcularPuntaje(
            preguntaUsuario,
            preguntaBase
        ) {

            const palabrasUsuario =
                obtenerPalabras(
                    preguntaUsuario
                );


            const palabrasPregunta =
                obtenerPalabras(
                    preguntaBase
                );


            if (
                palabrasUsuario.length === 0 ||
                palabrasPregunta.length === 0
            ) {

                return 0;

            }


            let coincidencias = 0;


            palabrasUsuario.forEach(
                palabraUsuario => {


                    /*
                     * Coincidencia exacta
                     */

                    if (
                        palabrasPregunta.includes(
                            palabraUsuario
                        )
                    ) {

                        coincidencias += 1;

                        return;

                    }


                    /*
                     * Coincidencia aproximada
                     */

                    const aproximada =
                        palabrasPregunta.some(
                            palabra =>

                                palabra.length >= 4 &&

                                (
                                    palabra.startsWith(
                                        palabraUsuario
                                    )

                                    ||

                                    palabraUsuario.startsWith(
                                        palabra
                                    )
                                )
                        );


                    if (
                        aproximada
                    ) {

                        coincidencias += 0.7;

                    }

                }
            );


            /*
             * Si la pregunta del usuario es prácticamente
             * la misma que la de la base, darle prioridad.
             */

            const textoUsuario =
                normalizarTexto(
                    preguntaUsuario
                );


            const textoBase =
                normalizarTexto(
                    preguntaBase
                );


            if (
                textoUsuario ===
                textoBase
            ) {

                return 1;

            }


            /*
             * Puntaje ponderado.
             */

            const coberturaUsuario =
                coincidencias /
                palabrasUsuario.length;


            const coberturaPregunta =
                coincidencias /
                palabrasPregunta.length;


            /*
             * Promedio ponderado.
             */

            return (
                coberturaUsuario * 0.65
            ) +
            (
                coberturaPregunta * 0.35
            );

        }


        /* =========================================================
           BUSCAR RESPUESTA
           ========================================================= */

        async function buscarRespuesta(
            preguntaUsuario
        ) {

            try {


                const baseChatbot =
                    obtenerBaseChatbot();


                if (
                    baseChatbot.length === 0
                ) {

                    return null;

                }


                let mejorCoincidencia =
                    null;


                let mejorPuntaje = 0;


                /*
                 * Buscar en TODA la base.
                 */

                baseChatbot.forEach(
                    item => {


                        const puntaje =
                            calcularPuntaje(
                                preguntaUsuario,
                                item.pregunta
                            );


                        if (
                            puntaje >
                            mejorPuntaje
                        ) {

                            mejorPuntaje =
                                puntaje;


                            mejorCoincidencia =
                                item;

                        }

                    }
                );


                /*
                 * Umbral mínimo.
                 *
                 * 0.30 = relativamente flexible.
                 */

                const UMBRAL_COINCIDENCIA =
                    0.30;


                console.log(
                    "Pregunta:",
                    preguntaUsuario
                );


                console.log(
                    "Mejor coincidencia:",
                    mejorCoincidencia
                        ? mejorCoincidencia.pregunta
                        : "ninguna"
                );


                console.log(
                    "Puntaje:",
                    mejorPuntaje
                );


                if (
                    mejorCoincidencia &&
                    mejorPuntaje >=
                        UMBRAL_COINCIDENCIA
                ) {

                    return mejorCoincidencia;

                }


                return null;


            } catch (error) {

                console.error(
                    "Error buscando respuesta:",
                    error
                );


                return {

                    respuesta:

                        idiomaActual === "en"

                            ? "There was an error while searching for an answer."

                            : "Se produjo un error al buscar la respuesta."

                };

            }

        }


        /* =========================================================
           MOSTRAR RESPUESTA
           ========================================================= */

        function mostrarRespuesta(
            texto
        ) {

            const zona =
                document.getElementById(
                    "chatbotRespuesta"
                );


            if (!zona) {

                return;

            }


            zona.textContent =
                texto;

        }


        /* =========================================================
           PROCESAR PREGUNTA
           ========================================================= */

        async function procesarPregunta(
            pregunta
        ) {


            const preguntaLimpia =
                pregunta.trim();


            /*
             * Pregunta vacía
             */

            if (
                !preguntaLimpia
            ) {

                mostrarRespuesta(

                    idiomaActual === "en"

                        ? "Write a question so I can help you."

                        : "Escribí una pregunta para que pueda ayudarte."

                );


                return;

            }


            /*
             * Mensaje de búsqueda
             */

            mostrarRespuesta(

                idiomaActual === "en"

                    ? "Searching..."

                    : "Buscando..."

            );


            /*
             * Buscar respuesta
             */

            const resultado =
                await buscarRespuesta(
                    preguntaLimpia
                );


            /*
             * Encontrada
             */

            if (
                resultado &&
                resultado.respuesta
            ) {

                mostrarRespuesta(
                    resultado.respuesta
                );


                return;

            }


            /*
             * No encontrada
             */

            mostrarRespuesta(

                idiomaActual === "en"

                    ? "I don't have an answer for that question yet. Try asking it another way or choose one of the frequently asked questions."

                    : "Todavía no tengo una respuesta para esa consulta. Probá escribiendo la pregunta de otra manera o elegí una de las preguntas frecuentes."

            );

        }


        /* =========================================================
           EVENTO CHATBOT
           ========================================================= */

        document
            .getElementById(
                "chatbotForm"
            )
            .addEventListener(
                "submit",
                function(event) {


                    event.preventDefault();


                    const input =
                        document.getElementById(
                            "chatbotInput"
                        );


                    procesarPregunta(
                        input.value
                    );


                    input.value = "";


                    input.focus();

                }
            );


        /* =========================================================
           INICIAR
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                cargarDatos();

            }
        );


    </script>
